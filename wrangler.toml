name = "shottrax-share"
main = "worker.js"
compatibility_date = "2026-09-23"

# Existing KV namespace "shottrax-boards".
# Binding name must stay BOARDS so it matches env.BOARDS in worker.js.
# Keep this id on every `wrangler deploy` so a dashboard bind is not dropped.
# preview_id is omitted; add one only after creating a preview namespace.
[[kv_namespaces]]
binding = "BOARDS"
id = "cfa1824a10374ab6a7fa0c97d0990e80"

# Daily refill of queued golfapi course ids and searches. 08:00 UTC is early morning in the US.
[triggers]
crons = ["0 8 * * *"]

# Golfapi quota overrides. Unset vars use the defaults documented at the top of worker.js.
# IP limits default to twice the matching device limit. The API key is a secret, not a var:
#   wrangler secret put GOLFAPI_KEY
# Allowlisted install ids are a secret too, so they stay out of git and survive deploys:
#   wrangler secret put GOLFAPI_ALLOWLIST
# The value is comma-separated install ids. Those phones skip device, IP, search,
# and the global cap. The balance floor still applies.
# Live board page (GET /s/{code}). Leave STORE_LIVE unset until ShotTraxx is live in
# the App Store; "true" adds the App Store banner and the App Store card. See README.
# [vars]
# STORE_LIVE = "true"
# GOLFAPI_DEVICE_DAY = "3"
# GOLFAPI_DEVICE_WEEK = "10"
# GOLFAPI_DEVICE_MONTH = "20"
# GOLFAPI_IP_DAY = "6"
# GOLFAPI_IP_WEEK = "20"
# GOLFAPI_IP_MONTH = "40"
# GOLFAPI_GLOBAL_DAY = "100"
# GOLFAPI_FLOOR = "10"
# A search + course + coordinates set stays open for 15 minutes.
# Fresh searches are also capped at 3x GOLFAPI_DEVICE_DAY per device per day.
# GOLFAPI_SEARCH_* vars are not read.
# GCA course and green-centers copies refresh after this many days. Default 30.
# GCA_REFRESH_DAYS = "30"
# Require X-Install-Id on /gca/v1/*. Leave unset. Installed builds do not send
# the header on GCA, so turning this on would reject them. While it is off,
# those calls are counted as missingInstallId on GET /meta/gca.
# GCA_REQUIRE_INSTALL_ID = "true"
# In-round course/hole reports (POST /v1/course-reports). Defaults are 30 new
# reports per IP per UTC day and 20 per X-Install-Id. Invalid values keep the defaults.
# COURSE_REPORTS_IP_DAY = "30"
# COURSE_REPORTS_DEVICE_DAY = "20"
# Admin GET /v1/course-reports is a secret, not a var. Leave it unset until the
# list should open; unset fails closed with 503. Do not commit the token.
#   wrangler secret put COURSE_REPORTS_ADMIN_TOKEN
