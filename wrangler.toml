name = "shottrax-share"
main = "worker.js"
compatibility_date = "2026-09-23"

# Existing KV namespace "shottrax-boards".
# Binding name must stay BOARDS so it matches env.BOARDS in worker.js.
# Keep this id on every `wrangler deploy` so a dashboard bind is not dropped.
# preview_id is omitted; add one only after creating a preview namespace.
[[kv_namespaces]]
binding = "BOARDS"
id = "cfa1824a10374ab6a7fa0c97d0990e80"

# Daily refill of queued golfapi course ids and searches. 08:00 UTC is early morning in the US.
[triggers]
crons = ["0 8 * * *"]

# Golfapi quota overrides. Unset vars use the defaults documented at the top of worker.js.
# IP limits default to twice the matching device limit. The API key is a secret, not a var:
#   wrangler secret put GOLFAPI_KEY
# [vars]
# GOLFAPI_DEVICE_DAY = "3"
# GOLFAPI_DEVICE_WEEK = "10"
# GOLFAPI_DEVICE_MONTH = "20"
# GOLFAPI_IP_DAY = "6"
# GOLFAPI_IP_WEEK = "20"
# GOLFAPI_IP_MONTH = "40"
# GOLFAPI_GLOBAL_DAY = "40"
# GOLFAPI_FLOOR = "10"
# A search + course + coordinates set stays open for 15 minutes.
# Fresh searches are also capped at 3x GOLFAPI_DEVICE_DAY per device per day.
# GOLFAPI_SEARCH_* vars are not read.
