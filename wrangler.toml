# Deploy config for the live Worker shottrax-share.
# One source: entry.js serves share/board routes and the golf proxy.
name = "shottrax-share"
main = "entry.js"
compatibility_date = "2026-09-23"
workers_dev = true

# Live binding, unchanged: share boards, paint, gca:/gapi:/gq:/cr:/osm: keys.
[[kv_namespaces]]
binding = "BOARDS"
id = "cfa1824a10374ab6a7fa0c97d0990e80"

# Golfapi bodies and terrain blobs. Not shottrax-boards.
[[kv_namespaces]]
binding = "GOLFAPI_KV"
id = "587c98f5372647a88bc9418aa076827a"

[[durable_objects.bindings]]
name = "GOLFAPI_COUNTER"
class_name = "GolfapiCounter"

[[migrations]]
tag = "v1-golfapi-counter"
new_sqlite_classes = ["GolfapiCounter"]

[[send_email]]
name = "ALERT_EMAIL"
destination_address = "shottraxx@gmail.com"

# 23:00 UTC every day. The handler decides from the live balance whether
# this night is inside the stockpile window. The 08:00 UTC queue drain is off.
[triggers]
crons = ["0 23 * * *"]

[vars]
GOLFAPI_INSTALL_DAILY_PULLS = "4"
GOLFAPI_INSTALL_DAILY_SEARCHES = "30"
GOLFAPI_INSTALL_DAILY_CALL_BACKSTOP = "20"
GOLFAPI_DAILY_CAP = "150"
GOLFAPI_MONTHLY_CAP = "450"
GOLFAPI_CREDIT_FLOOR = "50"
GOLFAPI_PLAN_MONTHLY = "500"
GOLFAPI_CYCLE_DAY = "5"
GOLFAPI_ROLLOVER_CREDITS = "156"
GOLFAPI_STOCKPILE_ENABLED = "false"
GOLFAPI_STOCKPILE_DAY_HEADROOM = "30"
GOLFAPI_STOCKPILE_RUN_CREDITS = "800"
GOLFAPI_STOCKPILE_MAX_DAYS = "7"
GOLFAPI_STOCKPILE_DRY_RUN = "false"
ALERT_TO = "shottraxx@gmail.com"
ALERT_FROM = "alerts@shottraxx.com"
TERRAIN_INSTALL_DAILY_CAP = "54"
TERRAIN_MAX_GRID_POINTS = "6000"
